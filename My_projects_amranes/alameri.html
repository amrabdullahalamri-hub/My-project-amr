<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label{
            font-size: 18px;
            color: #444;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        input:focus{
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79,172,254,0.5);
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #4facfe;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #008cdd;
        }

        .link{
            text-align: center;
            margin-top: 15px;
        }

        .link a{
            text-decoration: none;
            color: #4facfe;
            font-size: 16px;
            font-weight: bold;
        }

        .link a:hover{
            color: #008cdd;
        }

    </style>

</head>
<body>

    <div class="container">

        <form action="index.html" method="post">

            <h2>تسجيل الدخول</h2>

            <label for="em">User Email</label><br>
            <input type="email" required id="em" placeholder="Enter the email">

            <label for="dh">User Password</label><br>
            <input type="password" required id="dh" placeholder="Enter the password">

            <p>
                <button type="submit">تسجيل الدخول</button>
            </p>

            <div class="link">
                <a href="amr.html">مقدم جديد ؟</a>
            </div>

        </form>

    </div>

</body>
</html>
